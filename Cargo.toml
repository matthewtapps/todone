[package]
name = "todone"
version = "1.0.1"
edition = "2024"
repository = "https://github.com/matthewtapps/todone"

[dependencies]
ratatui = "0.29"
crossterm = "0.28"
tui-textarea = { version = "0.7", default-features = false, features = ["crossterm", "ratatui"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
chrono = { version = "0.4", features = ["serde"] }
dirs = "6"
anyhow = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "net"] }
axum = "0.8"
rust-embed = { version = "8", features = ["mime-guess"] }
base64 = "0.22"
sha2 = "0.10"
getrandom = "0.3"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "gzip"] }
icalendar = { version = "0.17", features = ["chrono-tz", "recurrence"] }
chrono-tz = "0.10"
rrule = "0.14"
windows-timezones = "0.5"
arboard = { version = "3", features = ["wayland-data-control"] }

[profile.release]
lto = true
codegen-units = 1
strip = true

# The profile that 'dist' will build with
[profile.dist]
inherits = "release"
lto = "thin"
